<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0b3d91;stop-opacity:1" /> <!-- NASA Blue -->
      <stop offset="100%" style="stop-color:#4facfe;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Planet Body -->
  <circle cx="50" cy="50" r="40" fill="url(#grad)" filter="url(#glow)" />
  
  <!-- Ring System -->
  <ellipse cx="50" cy="50" rx="48" ry="12" fill="none" stroke="#fff" stroke-width="2" stroke-opacity="0.6" transform="rotate(-30 50 50)" />
  <ellipse cx="50" cy="50" rx="45" ry="10" fill="none" stroke="#fff" stroke-width="1" stroke-opacity="0.3" transform="rotate(-30 50 50)" />

  <!-- Small glimmer/star -->
  <path d="M 75 25 L 77 22 L 79 25 L 77 28 Z" fill="white" />
</svg>
